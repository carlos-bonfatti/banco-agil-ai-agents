name: Quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[ui,graph,dev]'
      - run: ruff check .
      - run: ruff format --check app.py banco_agil scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/benchmark.py
      - run: python scripts/evaluate.py --mode demo --min-exact-match 1
      - run: python scripts/benchmark_load.py --sizes 2 1000 --samples 20
      - run: pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheels"
      - run: python scripts/verify_wheel.py "$RUNNER_TEMP"/wheels/banco_agil-*.whl
